# ConfigMaps bundle the demo UI and API code for the lab.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  namespace: frontend
data:
  index.html: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <title>Message Board</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 640px; }
        h1 { text-align: center; }
        form { margin-bottom: 2rem; }
        textarea { width: 100%; min-height: 100px; padding: 0.5rem; }
        button { padding: 0.5rem 1rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem; border-bottom: 1px solid #ddd; }
        small { color: #666; display: block; }
        .error { color: #b00; margin-bottom: 1rem; }
        .success { color: #060; margin-bottom: 1rem; }
      </style>
    </head>
    <body>
      <h1>Cluster Message Board</h1>
      <p>Submit a note and the backend records it with the current cluster time. The latest ten entries show below.</p>
      <div id="feedback"></div>
      <form id="message-form">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
        <div style="margin-top: 0.5rem;">
          <button type="submit">Submit</button>
          <button type="button" id="refresh">Refresh</button>
        </div>
      </form>
    
      <h2>Latest Entries</h2>
      <ul id="entries"></ul>
    
      <script>
        const backendBase = 'http://backend.192.168.57.11.nip.io:30080';
        const entriesList = document.getElementById('entries');
        const feedback = document.getElementById('feedback');
        const form = document.getElementById('message-form');
        const messageField = document.getElementById('message');
    
        const setFeedback = (msg, type) => {
          feedback.textContent = msg;
          feedback.className = type || '';
        };
    
        const renderEntries = (entries) => {
          entriesList.innerHTML = '';
          if (!entries.length) {
            const li = document.createElement('li');
            li.textContent = 'No entries yet.';
            entriesList.appendChild(li);
            return;
          }
          entries.forEach((entry) => {
            const li = document.createElement('li');
            const message = document.createElement('div');
            message.textContent = entry.message;
            const timestamp = document.createElement('small');
            timestamp.textContent = `Submitted at ${entry.submitted_at}`;
            li.appendChild(message);
            li.appendChild(timestamp);
            entriesList.appendChild(li);
          });
        };
    
        const loadEntries = async () => {
          setFeedback('Loading latest entries…', '');
          try {
            const resp = await fetch(`${backendBase}/entries`);
            const data = await resp.json();
            renderEntries(Array.isArray(data) ? data : []);
            setFeedback('Showing latest entries.', 'success');
          } catch (err) {
            console.error(err);
            setFeedback('Failed to load entries.', 'error');
          }
        };
    
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const message = messageField.value.trim();
          if (!message) {
            setFeedback('Message cannot be empty.', 'error');
            return;
          }
          setFeedback('Submitting…', '');
          try {
            const resp = await fetch(`${backendBase}/entries`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message }),
            });
            if (!resp.ok) {
              const errData = await resp.json();
              throw new Error(errData.error || 'Failed to submit');
            }
            const data = await resp.json();
            renderEntries(Array.isArray(data) ? data : []);
            messageField.value = '';
            setFeedback('Message saved.', 'success');
          } catch (err) {
            console.error(err);
            setFeedback(err.message || 'Submission failed.', 'error');
          }
        });
    
        document.getElementById('refresh').addEventListener('click', loadEntries);
    
        loadEntries();
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app
  namespace: backend
data:
  app.py: |-
    from __future__ import annotations
    
    import datetime as dt
    import os
    from typing import Any, List
    
    import mysql.connector
    from flask import Flask, jsonify, request
    
    app = Flask(__name__)
    
    DB_HOST = os.environ.get("DB_HOST", "mysql.database.svc.cluster.local")
    DB_PORT = int(os.environ.get("DB_PORT", "3306"))
    DB_NAME = os.environ.get("DB_NAME", "testdb")
    DB_USER = os.environ.get("DB_USER", "root")
    DB_PASSWORD = os.environ.get("DB_PASSWORD", "password123")
    TABLE_NAME = os.environ.get("DB_TABLE", "messages")
    MAX_RESULTS = int(os.environ.get("DB_MAX_RESULTS", "10"))
    
    
    def get_connection() -> mysql.connector.connection.MySQLConnection:
        return mysql.connector.connect(
            host=DB_HOST,
            port=DB_PORT,
            database=DB_NAME,
            user=DB_USER,
            password=DB_PASSWORD,
        )
    
    
    def ensure_table_exists(cursor: mysql.connector.cursor.MySQLCursor) -> None:
        cursor.execute(
            f"""
            CREATE TABLE IF NOT EXISTS {TABLE_NAME} (
                id INT AUTO_INCREMENT PRIMARY KEY,
                submitted_at DATETIME NOT NULL,
                message TEXT NOT NULL
            ) ENGINE=InnoDB
            """
        )
    
    
    def fetch_recent(cursor: mysql.connector.cursor.MySQLCursor) -> List[dict[str, Any]]:
        cursor.execute(
            f"SELECT submitted_at, message FROM {TABLE_NAME} ORDER BY submitted_at DESC LIMIT %s",
            (MAX_RESULTS,),
        )
        rows = cursor.fetchall()
        return [
            {"submitted_at": row[0].isoformat(sep=" ", timespec="seconds"), "message": row[1]}
            for row in rows
        ]
    
    
    @app.after_request
    def add_cors_headers(response):
        response.headers["Access-Control-Allow-Origin"] = "*"
        response.headers["Access-Control-Allow-Headers"] = "Content-Type"
        response.headers["Access-Control-Allow-Methods"] = "GET,POST,OPTIONS"
        return response
    
    
    @app.route("/healthz", methods=["GET"])
    def healthcheck() -> Any:
        return {"status": "ok"}
    
    
    @app.route("/readyz", methods=["GET"])
    def readiness() -> Any:
        try:
            with get_connection() as conn:
                with conn.cursor() as cursor:
                    ensure_table_exists(cursor)
            return {"status": "ready"}
        except Exception as exc:  # pragma: no cover
            return {"status": "error", "detail": str(exc)}, 500
    
    
    @app.route("/entries", methods=["OPTIONS"])
    def entries_options() -> Any:
        return ("", 204)
    
    
    @app.route("/entries", methods=["GET"])
    def list_entries() -> Any:
        with get_connection() as conn:
            with conn.cursor() as cursor:
                ensure_table_exists(cursor)
                entries = fetch_recent(cursor)
        return jsonify(entries)
    
    
    @app.route("/entries", methods=["POST"])
    def create_entry() -> Any:
        payload = request.get_json(silent=True) or {}
        message = (payload.get("message") or "").strip()
        if not message:
            return {"error": "message is required"}, 400
    
        submitted_at = dt.datetime.utcnow()
    
        with get_connection() as conn:
            with conn.cursor() as cursor:
                ensure_table_exists(cursor)
                cursor.execute(
                    f"INSERT INTO {TABLE_NAME} (submitted_at, message) VALUES (%s, %s)",
                    (submitted_at, message),
                )
                conn.commit()
                entries = fetch_recent(cursor)
        return jsonify(entries), 201
    
    
    if __name__ == "__main__":  # pragma: no cover
        app.run(host="0.0.0.0", port=8080)
  requirements.txt: |-
    Flask==3.0.3
    mysql-connector-python==8.3.0
    gunicorn==22.0.0
